name: Build candidate or publish immutable version
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [build, publish]
        default: build
permissions:
  contents: read
  id-token: write
concurrency:
  group: vasp-image-build-publication
  cancel-in-progress: false
jobs:
  image:
    runs-on: [self-hosted, azure-hpc]
    environment: image-publication
    timeout-minutes: 360
    env:
      ACTION: ${{ inputs.action }}
      PIPELINE: ${{ vars.PIPELINE_JSON_PATH }}
      VARFILE: ${{ vars.PUBLICATION_TFVARS_PATH }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      TF_APPROVED_APPLY: '1'
      TF_BACKEND_ACCOUNT: ${{ vars.TF_BACKEND_ACCOUNT }}
      TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}
      TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
      TF_BACKEND_KEY: ${{ vars.PUBLICATION_STATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          set -euo pipefail
          [[ $ACTION == build || $ACTION == publish ]]
          if [[ $ACTION == build ]]; then
            python3 scripts/build/manage.py build --pipeline "$PIPELINE" --approve
          else
            bash scripts/build/terraform.sh publication apply -var-file="$VARFILE"
          fi
