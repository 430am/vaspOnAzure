name: Promote reviewed gallery version
on:
  workflow_dispatch:
    inputs:
      image_version_id:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: vasp-image-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: [self-hosted, azure-hpc]
    environment: image-promotion
    timeout-minutes: 15
    env:
      VERSION_ID: ${{ inputs.image_version_id }}
      RECEIPT: ${{ vars.VALIDATION_RECEIPT_PATH }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_PROMOTION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python3 scripts/build/manage.py promote --approve --image-version-id "$VERSION_ID" --validation-receipt "$RECEIPT"
